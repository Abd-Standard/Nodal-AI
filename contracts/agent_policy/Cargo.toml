[package]
name = "stellar-agent-policy"
version = "0.1.0"
edition = "2021"
description = "Prototype custom account that enforces an on-chain per-window spending limit for the Nodal agent key (issue #813)"

[lib]
crate-type = ["cdylib"]
# Same reason as contracts/escrow: the crate is no_std outside of tests and
# has no runnable doc examples.
doctest = false

[dependencies]
soroban-sdk = { version = "20.0.0", features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "20.0.0", features = ["testutils"] }
ed25519-dalek = "2.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.dev]
panic = "unwind"

[profile.test]
panic = "unwind"
