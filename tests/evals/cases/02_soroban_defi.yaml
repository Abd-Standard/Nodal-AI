---
# Soroban / DeFi cases (11–20)

id: soroban-001
description: Invoke a Soroban contract method
prompt: "Call the transfer function on contract CABC with amount 100"
expectedTaskTypes:
  - soroban_invoke
recordedOutput:
  tasks:
    - type: soroban_invoke
      payload:
        contractId: CABC
        method: transfer
        args:
          - "100"
---
id: soroban-002
description: Query a Soroban contract storage value
prompt: "Read the balance storage key for GAAA on contract CABC"
expectedTaskTypes:
  - soroban_query
recordedOutput:
  tasks:
    - type: soroban_query
      payload:
        contractId: CABC
        key: balance
        account: GAAA
