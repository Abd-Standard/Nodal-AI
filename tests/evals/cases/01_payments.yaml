---
# Normal cases: payment operations (1–10)

id: pay-001
description: Simple XLM payment
prompt: "Send 10 XLM to GBOB123456789012345678901234567890123456789012345678901234"
expectedTaskTypes:
  - stellar_payment
expectedPayloadFields:
  amount: "10"
recordedOutput:
  tasks:
    - type: stellar_payment
      payload:
        destination: GBOB123456789012345678901234567890123456789012345678901234
        amount: "10"
        asset: XLM
---
id: pay-002
