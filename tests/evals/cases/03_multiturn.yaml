# Multi-turn / session context cases (21–30)

id: multiturn-001
description: Referencing last recipient ("same recipient")
prompt: "Send the same amount to Bob again"
expectedTaskTypes:
  - stellar_payment
expectedPayloadFields:
  destination: GBOB123
recordedOutput:
  tasks:
    - type: stellar_payment
      payload:
        destination: GBOB123
        amount: "10"
        asset: XLM
