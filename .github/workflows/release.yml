name: Release

# Triggered on version tags pushed to the repository (e.g. v1.2.3).
# Creates a GitHub Release whose body is derived from conventional-commit
# messages since the previous tag, so the changelog always reflects the
# actual diff without manual editing.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"     # pre-release tags: v1.2.3-rc.1

permissions:
  contents: write   # required to create a GitHub Release

jobs:
  release:
    name: Generate changelog and create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          # Fetch the entire history so conventional-changelog can walk all
          # commits back to the previous version tag.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ── Update CHANGELOG.md ─────────────────────────────────────────────
      # conventional-changelog-cli reads the commit history, derives entries
      # conforming to the Angular preset, and prepends them to CHANGELOG.md.
      # The -s flag edits the file in place.
      - name: Update CHANGELOG.md
        run: npm run changelog:update

      # ── Extract the notes for this release ──────────────────────────────
      # We want the GitHub Release body to contain only the section that was
      # just prepended for this tag, not the entire changelog history.
      # awk stops as soon as it hits the second "## " heading.
      - name: Extract release notes
        id: extract_notes
        run: |
          NOTES=$(awk '/^## /{count++; if(count==2) exit} count==1{print}' CHANGELOG.md)
          # Store multi-line output using the GitHub Actions heredoc syntax.
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ── Create GitHub Release ────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body: ${{ steps.extract_notes.outputs.notes }}
          # Mark as pre-release automatically if the tag contains a hyphen
          # (e.g. v1.2.3-rc.1).
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Commit the updated CHANGELOG.md back to main ────────────────────
      # The tag points at the release commit; we want the changelog update to
      # also land on the default branch so it remains in sync.
      - name: Commit updated CHANGELOG.md to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          # Only commit if there is actually a diff (idempotent on re-runs).
          git diff --cached --quiet || \
            git commit -m "chore(release): update CHANGELOG.md for ${{ github.ref_name }} [skip ci]"
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
