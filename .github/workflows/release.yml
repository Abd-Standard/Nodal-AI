name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate changelog
        run: npx conventional-changelog -p angular -i CHANGELOG.md -s

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Commit updated CHANGELOG.md to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changelog changes to commit."
            exit 0
          fi
          git commit -m "chore(release): update CHANGELOG.md for ${{ github.ref_name }} [skip ci]"
          CHANGELOG_COMMIT=$(git rev-parse HEAD)

          # The tag checkout is a detached HEAD, so pushing it directly to main
          # fails as a non-fast-forward whenever main has moved on since the tag
          # was cut. Rebase the changelog commit onto the current tip of main and
          # retry the push, re-fetching and rebasing on each rejection.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main origin/main
            if git cherry-pick "$CHANGELOG_COMMIT"; then
              if git push origin HEAD:main; then
                echo "Changelog pushed to main on attempt $attempt."
                exit 0
              fi
            fi
            echo "Push rejected (attempt $attempt); retrying after rebasing onto latest main..."
            git cherry-pick --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done

          echo "::error::Failed to push CHANGELOG.md to main after multiple attempts."
          exit 1
