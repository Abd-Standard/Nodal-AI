name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Type-check test files
        run: npx tsc --project tsconfig.test.json --noEmit

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - run: npm ci
      - run: npm run test:all

  test-rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: file

      - name: Run Rust tests
        run: cargo test --manifest-path contracts/escrow/Cargo.toml

  lint-rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: file
          components: clippy, rustfmt

      - name: Run Clippy
        run: cargo clippy --manifest-path contracts/escrow/Cargo.toml -- -D warnings

      - name: Run rustfmt Check
        run: cargo fmt --manifest-path contracts/escrow/Cargo.toml -- --check

  coverage-rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: file

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Run cargo-tarpaulin
        run: cargo tarpaulin --manifest-path contracts/escrow/Cargo.toml --out Html --output-dir coverage/rust

  wasm-size-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: file

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Build contract WASM
        run: cargo build --manifest-path contracts/escrow/Cargo.toml --target wasm32-unknown-unknown --release

      # Fails if the compiled WASM exceeds the size budget, detecting
      # supply-chain bloat (e.g. injected data segments) before deployment.
      # See contracts/escrow/WASM_SIZE_BUDGET.md for the rationale.
      - name: Enforce WASM size budget
        run: bash scripts/check_wasm_size.sh
        env:
          MAX_WASM_SIZE_BYTES: 200000

  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scanning with trufflehog
        uses: trufflesecurity/trufflehog@v3.95.7
        with:
          extra_args: --config .trufflehog.yml --results=verified,unknown

  audit-npm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  snyk:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Check Snyk configuration
        id: snyk-config
        shell: bash
        run: |
          if [[ -n "$SNYK_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Snyk is skipped because SNYK_TOKEN is not configured."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.snyk-config.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.snyk-config.outputs.enabled == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.snyk-config.outputs.enabled == 'true'
        run: npm ci

      - name: Install Snyk CLI
        if: steps.snyk-config.outputs.enabled == 'true'
        run: npm install --global snyk

      - name: Test dependencies with Snyk
        if: steps.snyk-config.outputs.enabled == 'true'
        run: snyk test --severity-threshold=high

  audit-rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: file

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: cargo audit --manifest-path contracts/escrow/Cargo.toml

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate API docs (TypeDoc)
        run: npm run docs:generate

      - name: Upload API docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docs/api/
          retention-days: 30

  check-links:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Validates every relative and external Markdown link across the repo's
      # root docs and the escrow contract docs, so stale references (renamed
      # files, dead external URLs) fail CI instead of rotting silently.
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude "^https?://localhost(:[0-9]+)?"
            --exclude "^#"
            ./*.md
            ./contracts/escrow/*.md
          fail: true
